name: Reliability tests
on:
  push:
    branches: [feat/reliability-hardening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
      - name: Install exact HA runtime and pinned device library
        run: python -m pip install 'homeassistant==2026.9.0' 'miraie-ac==1.1.2' pytest pytest-asyncio
      - name: Regression tests
        run: python -m unittest discover -s tests -v
      - name: Real Home Assistant runtime tests
        run: python -m pytest tests/ha_runtime -v
